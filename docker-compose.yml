services:
  ollama:
    image: ollama/ollama
    container_name: extensionsummarizer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama
    container_name: extensionsummarizer-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
        ollama pull llama3.1 &&
        echo 'Model ready.'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: extensionsummarizer-api
    ports:
      - "5000:8080"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__Model=llama3.1
    restart: unless-stopped

volumes:
  ollama_data:
